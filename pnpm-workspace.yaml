packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "mobile_apps/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false
  '@scarf/scarf': set this to true or false

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.21'
  - '@expo/metro-config@58.0.23'
  - '@expo/router-server@58.0.23'
  - babel-preset-expo@58.0.26
  - expo-file-system@58.0.14
  - expo@58.0.26
  - '@expo/ui@58.0.29'
  - expo-router@58.0.32
  - expo-web-browser@58.1.0
